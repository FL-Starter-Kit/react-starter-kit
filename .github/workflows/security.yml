name: Security

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json

  pull_request:
    paths:
      - package.json
      - package-lock.json

  schedule:
    # Nightly: catch newly published dependency advisories.
    - cron: '0 3 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
